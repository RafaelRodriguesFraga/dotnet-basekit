name: Master Release

on:
  push:
    branches:
      - master

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="0.0.0"
          fi

          echo "Latest tag: $LATEST_TAG"
          echo "latest=$LATEST_TAG" >> "$GITHUB_OUTPUT"
        
      - name: Analyze release
        id: analyze
        run: |
          LATEST_TAG="${{ steps.tag.outputs.latest }}"

          TYPE=$(./scripts/analyze-commits.sh "$LATEST_TAG")

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG="${{ steps.tag.outputs.latest }}"
          TYPE="${{ steps.analyze.outputs.type }}"

          NEXT_VERSION=$(./scripts/release.sh "$LATEST_TAG" "$TYPE")

          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get commits since latest tag
        run: |
          LATEST_TAG="${{ steps.tag.outputs.latest }}"

          echo "Commits since $LATEST_TAG:"

          if git rev-parse "$LATEST_TAG" >/dev/null 2>&1; then
            git log "$LATEST_TAG"..HEAD --oneline
          else
            git log --oneline
          fi

      - name: Show release information
        run: |
          echo "Current branch: ${{ github.ref_name }}"
          echo "Latest commit: ${{ github.sha }}"
          echo "Latest version: ${{ steps.tag.outputs.latest }}"
          echo "Change type: ${{ steps.analyze.outputs.type }}"
          echo "Next version: ${{ steps.version.outputs.next }}"